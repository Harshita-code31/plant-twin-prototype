name: Deploy admin dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Sparse checkout: the Unity project is large (LFS assets, Library) and only dashboard/ is published.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard
          lfs: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
